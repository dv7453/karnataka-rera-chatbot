<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Karnataka RERA Chatbot — Search and verify real estate projects registered under K-RERA. Get project status, promoter details, and more.">
  <title>Karnataka RERA Chatbot</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
</head>
<body>

<div class="app" id="app">

  <!-- ============================================================ -->
  <!--  Header                                                       -->
  <!-- ============================================================ -->
  <header class="header" id="header">
    <div class="header-left">
      <div class="header-icon">🏗️</div>
      <div>
        <div class="header-title">Karnataka RERA Assistant</div>
        <div class="header-subtitle">Real Estate Regulatory Authority</div>
      </div>
    </div>
    <div class="header-badge empty" id="data-badge">
      <span class="dot"></span>
      <span id="data-badge-text">Loading…</span>
    </div>
  </header>

  <!-- ============================================================ -->
  <!--  Chat Messages                                                -->
  <!-- ============================================================ -->
  <main class="chat-area" id="chat-area" aria-live="polite">

    <!-- Welcome message injected by JS -->

  </main>

  <!-- Typing indicator -->
  <div class="typing-indicator" id="typing-indicator">
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
  </div>

  <!-- ============================================================ -->
  <!--  Input                                                        -->
  <!-- ============================================================ -->
  <div class="input-area">
    <div class="input-wrapper">
      <input
        type="text"
        id="chat-input"
        placeholder="Search projects, promoters, or paste a RERA number…"
        autocomplete="off"
        aria-label="Chat input"
      >
      <button id="send-btn" aria-label="Send message" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
